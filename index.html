<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV Maker - Fixed</title>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:15px}
.box{max-width:1000px;margin:auto;display:flex;gap:15px;flex-wrap:wrap}
.left,.right{background:#fff;padding:20px;border-radius:12px;flex:1;min-width:320px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:14px;background:#000;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
#cvPreview{border-top:5px solid #000}
</style>
</head>
<body>
<div class="box">
<div class="left">
<h2>Make Your CV</h2>
<input type="text" id="name" placeholder="Full Name" onkeyup="createCV()">
<input type="text" id="title" placeholder="Job Title" onkeyup="createCV()">
<input type="text" id="phone" placeholder="Phone Number" onkeyup="createCV()">
<input type="text" id="email" placeholder="Email" onkeyup="createCV()">
<textarea id="about" placeholder="About Yourself" onkeyup="createCV()"></textarea>
<textarea id="edu" placeholder="Education" onkeyup="createCV()"></textarea>
<textarea id="skills" placeholder="Skills" onkeyup="createCV()"></textarea>
<textarea id="exp" placeholder="Experience" onkeyup="createCV()"></textarea>
<button onclick="window.print()">Download / Print CV</button>
</div>
<div class="right" id="cvPreview">
<h1 id="pName">Your Name</h1>
<h3 id="pTitle" style="color:gray;">Your Job Title</h3>
<p><span id="pPhone"></span> | <span id="pEmail"></span></p>
<hr>
<p id="pAbout"></p>
<h3>Education</h3><p id="pEdu"></p>
<h3>Skills</h3><p id="pSkills"></p>
<h3>Experience</h3><p id="pExp"></p>
</div>
</div>
<script>
function createCV(){
document.getElementById('pName').innerText = document.getElementById('name').value || 'Your Name';
document.getElementById('pTitle').innerText = document.getElementById('title').value || 'Your Job Title';
document.getElementById('pPhone').innerText = document.getElementById('phone').value;
document.getElementById('pEmail').innerText = document.getElementById('email').value;
document.getElementById('pAbout').innerText = document.getElementById('about').value;
document.getElementById('pEdu').innerText = document.getElementById('edu').value;
document.getElementById('pSkills').innerText = document.getElementById('skills').value;
document.getElementById('pExp').innerText = document.getElementById('exp').value;
}
</script>
</body>
</html>
