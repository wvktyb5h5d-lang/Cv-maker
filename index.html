<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Professional CV Maker</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:#f0f2f5;padding:15px}.container{max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:800px){.container{grid-template-columns:1fr}}.form-box,.cv-box{background:#fff;padding:25px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}h2{margin-bottom:15px;color:#1a73e8}label{font-weight:700;display:block;margin-top:12px;margin-bottom:4px}input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin-bottom:8px}textarea{resize:vertical;min-height:70px}.btn{background:#1a73e8;color:#fff;border:none;padding:12px;width:100%;border-radius:8px;font-size:16px;cursor:pointer;margin-top:15px}.btn:hover{background:#0d62d1}#cvPreview{border:1px solid #ddd;padding:25px;min-height:500px}#cvPreview h1{font-size:28px;color:#222}#cvPreview h3{color:#1a73e8;margin-top:18px;border-bottom:1px solid #eee;padding-bottom:4px}#cvPreview p{white-space:pre-wrap;font-size:15px;line-height:1.6}@media print{body *{visibility:hidden}#cvPreview,#cvPreview *{visibility:visible}#cvPreview{position:absolute;left:0;top:0;width:100%;border:none;box-shadow:none}.no-print{display:none!important}}</style></head><body><div class="container"><div class="form-box no-print"><h2>Create Your CV</h2><label>Full Name</label><input id="name" placeholder="John Doe" oninput="updateCV()"><label>Email</label><input id="email" placeholder="john@email.com" oninput="updateCV()"><label>Phone</label><input id="phone" placeholder="+92 300 1234567" oninput="updateCV()"><label>Address</label><input id="address" placeholder="Quetta, Pakistan" oninput="updateCV()"><label>Professional Summary</label><textarea id="summary" oninput="updateCV()"></textarea><label>Education</label><textarea id="education" oninput="updateCV()"></textarea
